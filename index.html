/* ─────────────────────────────────────────────
   CURRENT DAY DETECTION
   Parses each milestone's date string and
   compares to today. Works automatically every
   day — zero manual editing needed.
───────────────────────────────────────────── */
const MONTH_MAP = {
  'Jan':0,'Feb':1,'Mar':2,'Apr':3,'May':4,'Jun':5,
  'Jul':6,'Aug':7,'Sep':8,'Oct':9,'Nov':10,'Dec':11
};

function parseMilestoneDate(dateStr) {
  // e.g. "May 6" → Date(2026, 4, 6)
  const [mon, day] = dateStr.split(' ');
  return new Date(2026, MONTH_MAP[mon], parseInt(day, 10));
}

function getMilestoneStatus(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const mDate = parseMilestoneDate(dateStr);
  if (mDate.getTime() === today.getTime()) return 'today';
  if (mDate < today) return 'past';
  return 'future';
}

/* Find the first "today" milestone index — only exact date match */
function getTodayIndex() {
  for (let i = 0; i < MILESTONES.length; i++) {
    if (getMilestoneStatus(MILESTONES[i].date) === 'today') return i;
  }
  return -1; // today is not a milestone date
}

/* ─────────────────────────────────────────────
   LAYOUT — responsive, computed once on render
───────────────────────────────────────────── */
function getLayout() {
  const vw      = window.innerWidth;
  const mobile  = vw < 600;
  const CW      = Math.min(vw, 520);
  const SWING   = mobile ? CW * 0.28 : CW * 0.32;
  const SPACING = mobile ? 90 : 110;
  /* ↑↑ TOP_PAD increased by 60px to create breathing room for the flag */
  const TOP_PAD = mobile ? 170 : 190;
  const BOT_PAD = mobile ? 110 : 130;
  const CX      = CW / 2;
  return { CW, SWING, SPACING, TOP_PAD, BOT_PAD, CX, mobile };
}

function getX(i, layout) {
  return (i % 2 === 0)
    ? layout.CX - layout.SWING
    : layout.CX + layout.SWING;
}

function buildPath(layout) {
  const { SPACING, TOP_PAD, BOT_PAD, CW } = layout;
  const N   = MILESTONES.length;
  const CH  = TOP_PAD + (N - 1) * SPACING + BOT_PAD;
  const pts = MILESTONES.map((_, i) => ({
    x: getX(i, layout),
    y: TOP_PAD + i * SPACING
  }));

  let d = `M ${pts[0].x} ${TOP_PAD - 55}`;

  pts.forEach((p, i) => {
    if (i === 0) {
      d += ` L ${p.x} ${p.y}`;
    } else {
      const prev = pts[i - 1];
      const c1x = prev.x, c1y = prev.y + SPACING * 0.55;
      const c2x = p.x,    c2y = p.y   - SPACING * 0.55;
      d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p.x} ${p.y}`;
    }
  });

  const last = pts[N - 1];
  d += ` L ${last.x} ${CH - BOT_PAD + 55}`;

  return { d, pts, CH };
}

/* ─────────────────────────────────────────────
   RENDER
───────────────────────────────────────────── */
let todayMilestoneEl = null; // reference for auto-scroll

  todayMilestoneEl = null;
  const layout = getLayout();
  const { CW, TOP_PAD, BOT_PAD, mobile } = layout;
  const { d, pts, CH } = buildPath(layout);

  const circleSize = mobile ? 52 : 62;
  const armW       = mobile ? 28 : 40;
  const labelMax   = mobile ? 110 : 150;
  const flagSize   = mobile ? 48 : 64;
  const trophySize = mobile ? '2.6rem' : '3.6rem';

  const svg = document.getElementById('rmSvg');
  svg.setAttribute('viewBox', `0 0 ${CW} ${CH}`);

  const canvas = document.getElementById('rmCanvas');
  canvas.style.width  = CW + 'px';
  canvas.style.height = CH + 'px';

  document.getElementById('roadPath').setAttribute('d', d);
  document.getElementById('dashPath').setAttribute('d', d);

  const wrap = document.getElementById('milestones');
  wrap.innerHTML = '';

  /* ── CHEQUERED FLAG ────────────────────────────────────── */
  const flagX = pts[0].x;
  const flagY = TOP_PAD - 55;
  const flagEl = document.createElement('div');
  flagEl.className = 'road-flag';
  flagEl.style.left = (flagX / CW * 100) + '%';
  flagEl.style.top  = (flagY / CH * 100) + '%';
  flagEl.innerHTML = `
    <svg class="flag-svg" style="width:${flagSize}px;height:${Math.round(flagSize*0.67)}px" viewBox="0 0 56 38" xmlns="http://www.w3.org/2000/svg">
      <rect width="56" height="38" fill="#fff"/>
      <rect x="0"  y="0"  width="14" height="12" fill="#111"/>
      <rect x="28" y="0"  width="14" height="12" fill="#111"/>
      <rect x="14" y="12" width="14" height="13" fill="#111"/>
      <rect x="42" y="12" width="14" height="13" fill="#111"/>
      <rect x="0"  y="25" width="14" height="13" fill="#111"/>
      <rect x="28" y="25" width="14" height="13" fill="#111"/>
    </svg>
    <div class="flag-pole"></div>
    <div class="flag-label">START</div>
  `;
  wrap.appendChild(flagEl);

  /* ── MILESTONES ─────────────────────────────────────── */
  let lastMonth = '';
  const todayIdx = getTodayIndex();

  MILESTONES.forEach((m, i) => {
    const p      = pts[i];
    const side   = (i % 2 === 0) ? 'left' : 'right';
    const status = getMilestoneStatus(m.date);
    const isToday = (status === 'today');
    // Only highlight if today exactly matches this milestone's date
    const isHighlighted = isToday;

    /* Month banner */
    if (m.mL && m.mL !== lastMonth) {
      lastMonth = m.mL;
      const mdiv = document.createElement('div');
      mdiv.className = 'month-divider';
      mdiv.style.top  = ((p.y - 48) / CH * 100) + '%';
      mdiv.style.left = '50%';
      mdiv.textContent = m.mL;
      wrap.appendChild(mdiv);
    }

    /* TODAY badge (only for exact today or nearest) */
    let todayBadgeHtml = '';
    if (isHighlighted) {
      todayBadgeHtml = `<div class="today-badge">TODAY</div>`;
    }

    const todayCircleSize = isHighlighted ? Math.round(circleSize * 1.22) : circleSize;

    const [mon, day] = m.date.split(' ');
    const el = document.createElement('div');

    // Build class list
    let classStr = `ms ${side}`;
    if (status === 'past') classStr += ' ms-past';
    if (isHighlighted)     classStr += ' ms-today';

    el.className = classStr;
    el.style.cssText = `
      left:${(p.x / CW * 100)}%;
      top:${(p.y / CH * 100)}%;
      --circle:${todayCircleSize}px;
      --arm:${armW}px;
      --lmax:${labelMax}px;
    `;

    el.innerHTML = `
      ${isHighlighted ? '<div class="today-pulse-ring" style="--tcolor:' + m.color + '"></div>' : ''}
      ${isHighlighted ? '<div class="today-glow-ring" style="--tcolor:' + m.color + '"></div>' : ''}
      <div class="ms-circle" style="background:linear-gradient(135deg,${m.color}ee,${m.color}99);border-color:${isHighlighted ? m.color : m.color+'88'};${isHighlighted ? 'box-shadow:0 0 0 4px '+m.color+'44,0 0 28px '+m.color+'88,0 0 56px '+m.color+'44;' : ''}">
        <span class="ms-day">${day}</span>
        <span class="ms-mon">${mon}</span>
      </div>
      <div class="ms-arm"></div>
      <div class="ms-label" style="border-color:${m.color}55;${isHighlighted ? 'border-color:'+m.color+';box-shadow:0 0 12px '+m.color+'55;' : ''}">
        ${todayBadgeHtml}
        ${m.title}
      </div>
    `;

    el.onclick = () => { playClick(); showDetail(m); };
    wrap.appendChild(el);

    if (isHighlighted) todayMilestoneEl = el;
  });

  /* ── TROPHY ──────────────────────────────────────────── */
  const lp = pts[pts.length - 1];
  const tEl = document.createElement('div');
  tEl.className = 'road-trophy';
  tEl.style.left = (lp.x / CW * 100) + '%';
  tEl.style.top  = ((lp.y + 60) / CH * 100) + '%';
  tEl.innerHTML = `
    <div class="trophy-glow"></div>
    <div class="trophy-icon" style="font-size:${trophySize}">🏆</div>
    <div class="trophy-label">YOU DID IT!</div>
  `;
  wrap.appendChild(tEl);

  /* Auto-scroll to today's milestone after render */
  if (todayMilestoneEl) {
    requestAnimationFrame(() => {
      setTimeout(() => scrollToToday(), 400);
    });
  }
}

/* ─────────────────────────────────────────────
   AUTO-SCROLL TO TODAY
───────────────────────────────────────────── */
function scrollToToday() {
  if (!todayMilestoneEl) return;
  const view = document.getElementById('rm-view');
  const elRect   = todayMilestoneEl.getBoundingClientRect();
  const viewRect  = view.getBoundingClientRect();
  const target    = view.scrollTop + (elRect.top - viewRect.top) - (viewRect.height / 2) + (elRect.height / 2);
  view.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
}

/* ─────────────────────────────────────────────
   AUDIO
───────────────────────────────────────────── */
function playClick() {
  try {
    const a = document.getElementById('clickSound');
    a.currentTime = 0;
    a.play().catch(() => {});
  } catch(e) {}
}

/* ─────────────────────────────────────────────
   DETAIL VIEW
───────────────────────────────────────────── */
function showDetail(m) {
  document.getElementById('rm-view').classList.add('hidden');
  const dv = document.getElementById('dt-view');
  dv.classList.remove('hidden');
  dv.scrollTop = 0;

  const status = getMilestoneStatus(m.date);
  const statusBadge = status === 'today'
    ? `<div class="dt-today-badge">🎯 TODAY</div>`
    : status === 'past'
    ? `<div class="dt-past-badge">✅ Completed</div>`
    : '';

  document.getElementById('dtTopTitle').textContent = m.title;
  document.getElementById('dtHero').innerHTML = `
    <span class="dt-icon">${m.icon}</span>
    <div class="dt-badge">
      <div class="dt-badge-dot" style="background:${m.color}"></div>
      ${m.type.charAt(0).toUpperCase() + m.type.slice(1)}
    </div>
    ${statusBadge}
    <div class="dt-h2" style="color:${m.color}">${m.title}</div>
    <div class="dt-date">📅 ${m.date}, 2026 &nbsp;·&nbsp; ${m.sub}</div>
  `;

  let html = '';
  if (m.act.length) {
    html += `<div class="dt-section"><div class="dt-section-label">Today's Activities</div><div class="act-list">`;
    m.act.forEach(a => {
      html += `
        <div class="act-card" style="border-color:${m.color}33;--accent:${m.color};">
          <span class="act-icon">${a.icon}</span>
          <div class="act-title">${a.t}</div>
          ${a.tm ? `<div class="act-time" style="color:${m.color}">⏰ ${a.tm}</div>` : ''}
        </div>`;
    });
    html += `</div></div>`;
  }
  if (m.note.length) {
    html += `<div class="dt-section"><div class="dt-section-label">Notes</div>`;
    m.note.forEach(n => {
      const isAccess = n.t === 'Access';
      html += `
        <div class="info-card" style="border-color:${m.color}33;">
          <div class="info-card-icon">${n.icon}</div>
          <div style="width:100%">
            <h4>${n.t}</h4><p>${n.d}</p>
            ${isAccess ? `<a href="https://masterclass.holistictherapistgayathri.com/web/login" target="_blank" rel="noopener" class="tagmango-btn" style="--btn-color:${m.color}">Click here to access Tagmango Portal &#8594;</a>` : ''}
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('dtBody').innerHTML = html;
}

function goBack() {
  document.getElementById('dt-view').classList.add('hidden');
  document.getElementById('rm-view').classList.remove('hidden');
}

/* ─────────────────────────────────────────────
   INIT + RESIZE
───────────────────────────────────────────── */
renderRoadmap();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderRoadmap, 150);
});
</script>
